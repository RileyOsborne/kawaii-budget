version: '3.8'

services:
  kawaii-budget:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kawaii-budget
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      # Persistent SQLite database volume
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
